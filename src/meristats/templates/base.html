<!doctype html>
<html lang="en" data-theme="light" data-pref="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$page_title</title>
  <meta name="description" content="$description">
  <link rel="icon" href="assets/favicon.svg?v=4" type="image/svg+xml">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("theme-preference") || "system";
        var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-pref", pref);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="38 20 62 90">
      <g fill="none" stroke="currentColor"><path stroke-width="1.6" d="M69.43 24.85V39.5M69.45 95.32V105.52"/><path stroke-width="1.64" stroke-linecap="round" d="M54.03 89.84A27.78 27.78 0 0 1 63.04 39.7M75.91 39.71A27.78 27.78 0 0 1 84.55 90.05"/></g>
      <path fill="currentColor" fill-rule="evenodd" d="M67.71 43L70.86 43L70.86 45.41L72.88 45.41L72.88 48L70.86 48L70.86 51.94L76.18 51.94L72.18 63.14L74.08 63.44L74.08 65.7L72.03 66.1L72.03 66.27C72.03 70.98 72.48 75.81 74.01 80.27C75.55 84.77 78.19 88.9 81.16 92.61L57.41 92.61C57.5 92.5 57.59 92.39 57.68 92.27C57.86 92.05 58.05 91.83 58.22 91.61C58.66 91.06 59.08 90.51 59.48 89.94C60.7 88.25 61.8 86.47 62.73 84.61C64.15 81.77 65.19 78.72 65.8 75.6C66.39 72.54 66.54 69.39 66.54 66.27L66.54 66.1L64.49 65.7L64.49 63.44L66.39 63.14L62.39 51.94L67.71 51.94L67.71 48L65.69 48L65.69 45.41L67.71 45.41L67.71 43Z"/>
    </symbol>
  </svg>

  <button class="theme-toggle" id="theme-toggle" type="button">
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>
    </svg>
  </button>

  <main>
$body
  </main>

  <footer class="site-footer">
    <div class="wrap">
      &copy; 2026 Syed Taha. $title $version, GPL-3.0-or-later.
      <a href="$source_url">source</a>.
    </div>
  </footer>

  <script src="assets/site.js" defer></script>
  <script>
    (function () {
      var button = document.getElementById("theme-toggle");
      var media = window.matchMedia("(prefers-color-scheme: dark)");

      function read() {
        try { return localStorage.getItem("theme-preference") || "system"; } catch (e) { return "system"; }
      }

      function isDark(pref) {
        return pref === "dark" || (pref === "system" && media.matches);
      }

      function apply(pref) {
        var dark = isDark(pref);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-pref", pref);
        button.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      }

      button.addEventListener("click", function () {
        var next = isDark(read()) ? "light" : "dark";
        try { localStorage.setItem("theme-preference", next); } catch (e) {}
        apply(next);
      });

      media.addEventListener("change", function () {
        if (read() === "system") { apply("system"); }
      });

      apply(read());
    })();
  </script>
</body>
</html>

    <div class="wrap">
      <section class="hero">
        <div>
          <p class="eyebrow">Meridian chess engine</p>
          <h1>$title</h1>
          <p class="lede">$tagline</p>
          <div class="actions">
            <a class="btn btn-fill" href="$engine_url">Meridian on GitHub</a>
            <a class="btn btn-outline" href="$source_url">$title source</a>
          </div>
        </div>
        <div class="emblem" aria-hidden="true">
          <svg class="mark" viewBox="0 0 62 90"><use href="#mark"/></svg>
        </div>
      </section>

      <section class="status" aria-label="Status">
        <span class="status-label">Status</span>
        <p>$status</p>
        <span class="detail">$status_detail</span>
      </section>

$search
      <section aria-labelledby="pages">
        <h2 id="pages">Pages</h2>
        <div class="card-grid">
$page_cards
        </div>
      </section>
    </div>
